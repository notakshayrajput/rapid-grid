<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rapid-grid vanilla demo</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body {
      font: 14px system-ui;
      margin: 24px
    }

    #grid {
      width: 100%;
      height: 520px
    }

    #status {
      margin: 12px 0
    }
  </style>
</head>

<body>
  <h1>rapid-grid</h1>
  <p>100,000 rows × 10,000 columns. Drag or Shift+Arrow to select cells, Ctrl+C/Ctrl+V to copy and paste, double click
    to edit.</p>
  <div id="status">Loading…</div>
  <div id="grid"></div>
  <script type="module">
    import { RapidGrid, DataType, AllowDragging } from '../dist/esm/index.js';
    const rows = Array.from({ length: 100_000 }, (_, index) => ({ id: index, name: `Row ${index}`, price: index / 10 }));
    const columns = Array.from({ length: 1_000 }, (_, index) => ({
      binding: index === 0 ? 'id' : index === 1 ? 'name' : index === 2 ? 'price' : `field${index}`,
      header: `Column ${index}`,
      width: index === 1 ? 180 : 120,
      dataType: index === 0 || index === 2 ? DataType.Number : DataType.String,
      format: index === 2 ? 'n2' : undefined
    }));
    window.grid = new RapidGrid('#grid', { items: rows, columns, allowDragging: AllowDragging.Both });
    document.querySelector('#status').textContent = 'Ready';
  </script>
</body>

</html>
